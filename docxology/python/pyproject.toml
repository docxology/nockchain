[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "docxology"
version = "0.1.0"
description = "Python bindings for Nockchain orchestrator"
authors = [{name = "Nockchain Developers"}]
license = {text = "MIT OR Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/zorp-corp/nockchain"
Repository = "https://github.com/zorp-corp/nockchain"
Documentation = "https://docs.rs/docxology"

[tool.maturin]
python-source = "."
module-name = "docxology._docxology"
features = ["python"]

[project.scripts]
docxology = "docxology.cli:main"
